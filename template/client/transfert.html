<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfert : espace client</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">Mobile<span>Money</span></div>
    <p class="sidebar-role">Espace client</p>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="solde.html">Solde</a></li>
      <li class="nav-item"><a class="nav-link" href="depot.html">Dépôt</a></li>
      <li class="nav-item"><a class="nav-link" href="retrait.html">Retrait</a></li>
      <li class="nav-item"><a class="nav-link active" href="transfert.html">Transfert</a></li>
      <li class="nav-item"><a class="nav-link" href="historique.html">Historique des transactions</a></li>
    </ul>
    <div class="sidebar-pied">
      <a href="login.html">Déconnexion</a>
    </div>
  </aside>

  <main class="contenu">
    <div class="d-flex align-items-center justify-content-between gap-3 mb-4">
      <div>
        <h1 class="h3 mb-0">Transfert</h1>
        <p class="sous-titre">Envoyez de l'argent vers un autre compte Mobile Money.</p>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-12 col-lg-5">
        <section class="card">
          <div class="card-body">
            <form action="solde.html" method="get">
              <div class="mb-3">
                <label for="destinataire" class="form-label">Numéro de téléphone du destinataire</label>
                <input type="tel" class="form-control" id="destinataire" name="destinataire"
                       inputmode="numeric" pattern="[0-9]{10}" maxlength="10"
                       placeholder="0348989323" required>
                <div class="form-text">10 chiffres, sans espace.</div>
              </div>

              <div class="mb-3">
                <label for="montant" class="form-label">Montant à transférer (Ar)</label>
                <input type="number" class="form-control" id="montant" name="montant"
                       min="100" step="100" placeholder="120000" required>
              </div>

              <div class="mb-4">
                <label for="code" class="form-label">Code secret</label>
                <input type="password" class="form-control" id="code" name="code"
                       inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
                       placeholder="••••" required>
                <div class="form-text">4 chiffres.</div>
              </div>

              <button type="submit" class="btn btn-principal w-100">Transférer</button>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
