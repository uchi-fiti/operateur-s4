<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Money : choix de l'espace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="operateur/styles.css">
  <style>
    .boite-choix {
      max-width: 560px;
      text-align: center;
    }

    .btn-choix {
      width: 100%;
      height: 100%;
      padding: 32px 24px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .btn-choix small {
      display: block;
      font-size: 13px;
      font-weight: 400;
      margin-top: 8px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <main class="page-centree">
    <div class="boite boite-choix">
      <h1 class="h3">Mobile Money</h1>
      <p class="sous-titre mb-4">Choisissez votre espace pour continuer.</p>

      <div class="row g-3">
        <div class="col-12 col-sm-6 d-flex">
          <a class="btn btn-principal btn-choix" href="client/login.html">
            Client
            <small>Gérer mon compte</small>
          </a>
        </div>
        <div class="col-12 col-sm-6 d-flex">
          <a class="btn btn-secondaire btn-choix" href="operateur/login">
            Opérateur
            <small>Administrer la plateforme</small>
          </a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
